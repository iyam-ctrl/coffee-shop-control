name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: install
        run: pnpm install --no-frozen-lockfile
      - name: build
        run: pnpm build
